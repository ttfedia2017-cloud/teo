<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фёдор | Бизнес-брокер</title>
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --gold: #d4bca0;
            --gold-hover: #e8d5bd;
            --text: #f5f5f5;
            --text-muted: #a0a0a0;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.5;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid #333;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Блок с вашим фото */
        .photo-header {
            width: 100%;
            height: 380px; /* Высота фото */
            background-image: url('photo.jpg');
            background-size: cover;
            background-position: center 15%; /* Фокус на лицо */
            position: relative;
        }

        /* Плавный переход от фото к тексту */
        .photo-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: linear-gradient(to top, var(--card-bg), transparent);
        }

        .content {
            padding: 0 25px 35px 25px;
            text-align: center;
            position: relative;
            z-index: 2;
            margin-top: -50px; /* Поднимаем текст на фото */
        }

        h1 {
            font-size: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
            color: var(--gold);
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .subtitle {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text);
            margin-bottom: 25px;
            font-weight: 600;
            text-shadow: 0 2px 5px rgba(0,0,0,0.9);
        }

        .services {
            list-style: none;
            text-align: left;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .services li {
            padding: 10px 0;
            display: flex;
            align-items: center;
            font-size: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .services li:last-child {
            border-bottom: none;
        }

        .services .icon {
            margin-right: 12px;
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        .contacts {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--gold);
            color: #121212;
        }

        .btn-primary:hover {
            background-color: var(--gold-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 188, 160, 0.3);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
        }

        .btn-secondary:hover {
            background-color: rgba(212, 188, 160, 0.1);
            transform: translateY(-2px);
        }

        .quote {
            font-style: italic;
            color: var(--text-muted);
            font-size: 14px;
            border-top: 1px solid #333;
            padding-top: 20px;
        }

        .quote span {
            display: block;
            margin-top: 5px;
            font-style: normal;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Здесь подставляется ваше фото -->
        <div class="photo-header"></div>
        
        <div class="content">
            <h1>Фёдор</h1>
            <div class="subtitle">Бизнес - брокер</div>

            <ul class="services">
                <li><span class="icon">💎</span> Профессиональная оценка стоимости</li>
                <li><span class="icon">👥</span> Поиск реальных покупателей</li>
                <li><span class="icon">📄</span> Сопровождение сделки под ключ</li>
                <li><span class="icon">⏱</span> Консультация без оплаты</li>
            </ul>

            <div class="contacts">
                <a href="tel:+79169762097" class="btn btn-primary">📞 Позвонить</a>
                <a href="https://t.me/Feodor_77" target="_blank" class="btn btn-secondary">✈️ Telegram</a>
                <a href="https://vk.ru/id239142153" target="_blank" class="btn btn-secondary">🔵 ВКонтакте</a>
                <a href="https://www.instagram.com/fedot7_7" target="_blank" class="btn btn-secondary">📸 Instagram</a>
            </div>

            <div class="quote">
                «Ваш бизнес в надежных руках»
                <span>Опыт. Экспертиза. Результат.</span>
            </div>
        </div>
    </div>

</body>
</html>
